   html {
  -webkit-text-size-adjust: 100%;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0f;
  --text: #e8e8ed;
  --word-color: #ffffff;
  --card: #12121a;
  --border: #1e1e2e;
  --input: #0d0d14;
  --h1: #ffffff;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --accent-soft: rgba(59, 130, 246, 0.08);
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --muted: #6b7280;
  --sidebar-bg: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition-fast: 0.15s ease;
  --transition-base: 0.25s ease;
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Light Theme */
body.light {
  --bg: #f8f9fc;
  --text: #1a1a2e;
  --word-color: #1a1a2e;
  --card: #ffffff;
  --border: #e2e8f0;
  --input: #f1f5f9;
  --h1: #0f172a;
  --accent: #2563eb;
  --accent-glow: rgba(37, 99, 235, 0.1);
  --accent-soft: rgba(37, 99, 235, 0.05);
  --muted: #94a3b8;
  --sidebar-bg: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
  --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.08);
}

/* Gray Theme */
body.gray {
  --bg: #1e1e2e;
  --text: #e2e2ed;
  --word-color: #f0f0f5;
  --card: #2a2a3c;
  --border: #3a3a50;
  --input: #22223a;
  --h1: #f0f0f5;
  --accent: #60a5fa;
  --accent-glow: rgba(96, 165, 250, 0.12);
  --accent-soft: rgba(96, 165, 250, 0.06);
  --muted: #8888a0;
  --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #2a2a3c 100%);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(96, 165, 250, 0.1);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Heebo', Arial, sans-serif;
  padding: 20px;
  min-height: 100vh;
  transition: background var(--transition-slow), color var(--transition-slow);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1 {
  color: var(--h1);
  text-align: center;
  margin-bottom: 28px;
  font-size: 2.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  position: relative;
}

h1::after {
  content: '';
  display: block;
  width: 60px;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  margin: 12px auto 0;
  box-shadow: 0 0 12px var(--accent-glow);
}

.container {
  max-width: 850px;
  margin: 0 auto;
  position: relative;
}

/* ---- Section Cards ---- */
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-md);
  transition: all var(--transition-base);
  position: relative;
  overflow: hidden;
}

.section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
  opacity: 0;
  transition: opacity var(--transition-base);
}

.section:hover::before {
  opacity: 1;
}

/* ---- Word Box ---- */
.word-box {
  display: grid;
  grid-template-columns: 1fr 2px 1fr;
  align-items: center;
  min-height: 100px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-base);
}

.word-box:hover {
  box-shadow: var(--shadow-glow);
  border-color: rgba(59, 130, 246, 0.2);
}

.english,
.hebrew {
  padding: 24px;
  font-size: 1.75rem;
  font-weight: 700;
  min-height: 100px;
  display: flex;
  align-items: center;
  color: var(--word-color);
  transition: all var(--transition-base);
  letter-spacing: -0.01em;
}

.english {
  justify-content: flex-start;
  text-align: right;
}

.hebrew {
  justify-content: flex-end;
  text-align: left;
}

.divider {
  width: 2px;
  height: 100%;
  background: var(--border);
  transition: background var(--transition-base);
}

/* ---- Buttons ---- */
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

button {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 20px;
  cursor: pointer;
  font-size: 15px;
  font-family: 'Heebo', Arial, sans-serif;
  font-weight: 500;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--transition-fast);
}

button:hover {
  background: var(--border);
  border-color: rgba(59, 130, 246, 0.3);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

button:active {
  transform: translateY(0);
  box-shadow: none;
}

/* ---- Inputs ---- */
input,
textarea {
  width: 100%;
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  font-size: 16px;
  font-family: 'Heebo', Arial, sans-serif;
  margin-bottom: 12px;
  transition: all var(--transition-fast);
  outline: none;
}

input:focus,
textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

input::placeholder,
textarea::placeholder {
  color: var(--muted);
  opacity: 0.7;
}

/* ---- List Output ---- */
.list-output {
  margin-top: 16px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  line-height: 1.9;
  word-break: break-word;
  min-height: 60px;
  color: var(--text);
  font-size: 15px;
  transition: all var(--transition-base);
}

/* ---- Small Title ---- */
.small-title {
  margin-bottom: 16px;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.small-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 20px;
  background: var(--accent);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--accent-glow);
}

/* ---- Counter ---- */
.counter {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ---- Hidden ---- */
.hidden {
  display: none;
}

/* ---- Save Message ---- */
.save-msg {
  margin-top: 12px;
  color: var(--success);
  font-size: 14px;
  font-weight: 500;
}

/* ---- Confirm Dialog ---- */
.confirm {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  animation: fadeIn 0.2s ease;
}

.confirm.show {
  display: flex;
}

.confirm-inner {
  background: var(--card);
  padding: 32px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  text-align: center;
  width: 340px;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.confirm-inner #confirmText {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 24px;
  color: var(--text);
}

.confirm-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.confirm-buttons button {
  min-width: 100px;
  padding: 10px 24px;
  font-weight: 600;
}

.confirm-buttons button:first-child {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.confirm-buttons button:first-child:hover {
  background: #2563eb;
  border-color: #2563eb;
}

/* ---- Help Box ---- */
.help-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 300px;
  color: var(--text);
  font-weight: 600;
  display: none;
  z-index: 1000;
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.close-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
  line-height: 1;
}

.close-btn:hover {
  color: var(--text);
  border-color: var(--text);
  background: var(--border);
}

.help-btn {
  position: relative;
  padding: 6px 16px;
  font-size: 12px;
  background: var(--card);
  color: var(--text);
  font-weight: 700;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: all var(--transition-fast);
}

.help-btn:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-glow);
}

/* ---- Net (Version) ---- */
.net1 {
  display: flex;
  justify-content: right;
  background: var(--accent-glow);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.net2 {
  display: flex;
  justify-content: right;
  margin-bottom: 8px;
}

/* ---- Settings Button ---- */
.settings-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 24px;
  cursor: pointer;
  z-index: 1001;
  background: var(--accent-soft);
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: var(--radius-md);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all var(--transition-base);
  color: var(--text);
  line-height: 1;
}

.settings-btn:hover {
  background: var(--accent-glow);
  border-color: var(--accent);
  transform: rotate(30deg);
  box-shadow: var(--shadow-glow);
}

/* ---- Overlay ---- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  z-index: 1000;
  transition: opacity var(--transition-base);
}

.overlay.show {
  display: block;
}

/* ---- Sidebar ---- */
.sidebar {
  position: fixed;
  top: 0;
  right: -300px;
  width: 280px;
  height: 100%;
  background: var(--sidebar-bg);
  padding: 28px 24px;
  box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
  transition: right var(--transition-slow);
  z-index: 1002;
  border-left: 1px solid var(--border);
}

.sidebar.open {
  right: 0;
}

.sidebar h3 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.sidebar hr {
  border: none;
  height: 1px;
  background: var(--border);
  margin: 12px 0;
}

.sidebar button {
  width: 100%;
  text-align: center;
  font-weight: 600;
}

/* ---- Animations ---- */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
  50% { box-shadow: 0 0 20px 4px var(--accent-glow); }
}

/* ---- Responsive ---- */
@media (max-width: 700px) {
  body {
    padding: 12px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 20px;
  }

  .section {
    padding: 16px;
    border-radius: var(--radius-lg);
  }

  .word-box {
    grid-template-columns: 1fr;
    border-radius: var(--radius-md);
  }

  .divider {
    width: 100%;
    height: 1px;
  }

  .english,
  .hebrew {
    justify-content: center;
    text-align: center;
    font-size: 1.3rem;
    padding: 16px;
    min-height: 60px;
  }

  .btn-row {
    gap: 8px;
  }

  button {
    padding: 10px 14px;
    font-size: 14px;
  }

  .settings-btn {
    top: 12px;
    left: 12px;
    padding: 10px;
    font-size: 20px;
  }

  .sidebar {
    width: 260px;
    right: -280px;
  }

  .confirm-inner {
    width: 90%;
    max-width: 340px;
    padding: 24px;
  }
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

/* ---- Selection ---- */
::selection {
  background: var(--accent);
  color: #fff;
}

#siteLoader{
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-family: Arial, sans-serif;
}



.spinner{
  width:60px;

  transform-origin:center;
  animation:rotate 1s linear infinite;
}

.spinner circle{
  stroke:#fff;
  stroke-linecap:round;
  stroke-dasharray:100;
  stroke-dashoffset:60;
  animation:dash 1.5s ease-in-out infinite;
}

.text{
  opacity:0.8;
}

@keyframes rotate{
  100%{transform:rotate(360deg);}
}

@keyframes dash{
  0%{stroke-dashoffset:100;}
  50%{stroke-dashoffset:30;}
  100%{stroke-dashoffset:100;}
}

/* 💻 מסכים בינוניים - לפטופ */
@media (min-width: 900px) {

  .container{
    max-width: 1000px;
  }

  h1{
    font-size: 3rem;
  }

  .english,
  .hebrew{
    font-size: 2rem;
    padding: 28px;
  }

  .section{
    padding: 28px;
  }

  button{
    font-size: 16px;
    padding: 14px 22px;
  }
}


/* 🖥️ מסכים גדולים */
@media (min-width: 1200px) {

  .container{
    max-width: 1200px;
  }

  h1{
    font-size: 3.4rem;
  }

  .word-box{
    min-height: 130px;
  }

  .english,
  .hebrew{
    font-size: 2.3rem;
  }

    padding: 32px;
  }

}


/* 🧠 מסכים ממש גדולים (Ultra wide) */
@media (min-width: 1600px) {

  .container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
}
  body{
    font-size: 18px;
  }

  .english,
  .hebrew{
    font-size: 2.6rem;
  }

}

let confirmCallback = null;
let words = [...defaultWords];
let currentIndex = 0;
let translationVisible = false;
let isEditing = false;
let wordsHistory = [];
// 🔥 היסטוריית טקסט
let history = [];
let historyIndex = -1;
let typingTimer = null;

const englishWord = document.getElementById("englishWord");
const hebrewWord = document.getElementById("hebrewWord");
const counter = document.getElementById("counter");
const listOutput = document.getElementById("listOutput");
const listEditor = document.getElementById("listEditor");
const editBtn = document.getElementById("editBtn");
  
  
const confirmBox = document.getElementById("confirmBox");
const confirmText = document.getElementById("confirmText");
  
  
window.addEventListener("load", () => {
  setTimeout(() => {
    const loader = document.getElementById("siteLoader");
    loader.style.opacity = "0";
    loader.style.transition = "0.4s ease";

    setTimeout(() => {
      loader.style.display = "none";
    }, 400);

  }, 5000); // דיליי קטן כדי שהטעינה תראה יפה
});
  
function speakCurrent() {
  if (!words.length) return;
  speakWord(words[currentIndex].en);
}
  
  
  function speakWord(text) {
  if (!text) return;

  // עצור דיבור קודם
  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  function speakNow() {
    const voices = speechSynthesis.getVoices();

    const voice = voices.find(v => v.lang === "en-US")
      || voices.find(v => v.lang.startsWith("en"));

    if (voice) utterance.voice = voice;

    utterance.lang = "en-US";
    utterance.rate = 0.9;

    speechSynthesis.speak(utterance);
  }

  // אם אין קולות עדיין
  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = speakNow;
  } else {
    speakNow();
  }
}
  
function showConfirm(message, callback) {
  confirmText.textContent = message;
  confirmBox.classList.add("show");
  confirmCallback = callback;
}

function confirmYes() {
  confirmBox.classList.remove("show");
  if (confirmCallback) confirmCallback();
  confirmCallback = null;
}

function confirmNo() {
  confirmBox.classList.remove("show");
  confirmCallback = null;
}


// ------------------ בסיס ------------------

function renderWord() {
  if (!words.length) {
    englishWord.textContent = "אין מילים";
    hebrewWord.textContent = "";
    counter.textContent = "0 / 0";
    return;
  }

  englishWord.textContent = words[currentIndex].en;
  hebrewWord.textContent = translationVisible ? words[currentIndex].he : "";
  counter.textContent = `${currentIndex + 1} / ${words.length}`;
}

function buildListString() {
  if (!words.length) return "";
  return words.map(w => `${w.en} ${w.he}`).join(",\n");
}

function showList() {
  listOutput.classList.remove("hidden");
  listOutput.textContent = buildListString();
}

// ------------------ ניווט ------------------

function nextWord() {
  if (!words.length) return;
  currentIndex = (currentIndex + 1) % words.length;
  translationVisible = false;
  saveLocal(); // 👈 הוסף
  renderWord();
}

function prevWord() {
  if (!words.length) return;
  currentIndex = (currentIndex - 1 + words.length) % words.length;
  translationVisible = false;
  saveLocal(); // 👈 הוסף
  renderWord();
}

function toggleTranslation() {
  translationVisible = !translationVisible;
  renderWord();
}

// ------------------ UNDO חכם ------------------

// שמירה להיסטוריה
function saveHistory(value) {
  if (history[historyIndex] === value) return;

  history = history.slice(0, historyIndex + 1);
  history.push(value);
  historyIndex++;
}

// מאזין להקלדה
listEditor.addEventListener("input", () => {
  clearTimeout(typingTimer);

  typingTimer = setTimeout(() => {
    saveHistory(listEditor.value);
  }, 300); // חוסך הצפה
});

// Undo
function undo() {
  showConfirm("לבטל פעולה?", () => {

    if (isEditing && historyIndex > 0) {
      historyIndex--;
      listEditor.value = history[historyIndex];
      return;
    }

    if (wordsHistory.length === 0) {
      alert("אין מה לבטל");
      return;
    }

    words = JSON.parse(wordsHistory.pop());

    saveLocal(); // 👈 הוסף את זה

    showList();
    renderWord();
  });
}

// ------------------ עריכה ------------------

function handleEdit() {
  if (!isEditing) {
  listEditor.classList.remove("hidden");

  // 👇 תסתיר רשימה
  listOutput.classList.add("hidden");

  const text = buildListString();
  listEditor.value = text;

  history = [text];
  historyIndex = 0;

  editBtn.textContent = "שמור רשימה";
  isEditing = true;
  return;
}

  const text = listEditor.value.trim();
  const parts = text.split(/,|\n/);
  const updated = [];

  for (let part of parts) {
    const clean = part.trim();
    if (!clean) continue;

    const match = clean.match(/^(.+?)\s+([\u0590-\u05FF\s\/]+)$/);

if (!match) continue;

const en = match[1].trim();
const he = match[2].trim().replace(/,$/, "");
    
    if (en && he) {
      updated.push({ en, he });
    }
  }
wordsHistory.push(JSON.stringify(words));
  showConfirm("האם אתה בטוח שאתה רוצה לעדכן רשימה?", () => {
  words = updated;

  // 👇 סגור עורך
  listEditor.classList.add("hidden");

  // 👇 עדכן כפתור
  editBtn.textContent = "ערוך רשימה";
  isEditing = false;
    
saveLocal();
  // 👇 תציג רק רשימה אחת
  showList();
  renderWord();
});
}
  
function copyList() {
  const text = words.map(w => `${w.en} ${w.he}`).join(",\n");

  navigator.clipboard.writeText(text)
    .then(() => alert("הרשימה הועתקה"))
    .catch(() => alert("שגיאה בהעתקה"));
}
// ------------------ הוספה ------------------

function addWord() {
  const en = document.getElementById("newEnglish").value.trim();
  const he = document.getElementById("newHebrew").value.trim();

  if (!en || !he) {
    alert("צריך למלא הכל");
    return;
  }

  wordsHistory.push(JSON.stringify(words));
words.unshift({ en, he });
  currentIndex = 0;
  
  document.getElementById("newEnglish").value = "";
  document.getElementById("newHebrew").value = "";

saveLocal();
  showList();
  renderWord();
}
  
function saveLocal() {
  localStorage.setItem("words", JSON.stringify(words));
  localStorage.setItem("currentIndex", currentIndex);
}
  
  function loadLocal() {
  const data = localStorage.getItem("words");
  const savedIndex = localStorage.getItem("currentIndex");

  if (data) {
    words = JSON.parse(data);
  }

  if (savedIndex !== null) {
    currentIndex = parseInt(savedIndex);

    // 🔥 הגנה שלא יחרוג אם הרשימה השתנתה
    if (currentIndex >= words.length) {
      currentIndex = 0;
    }
  }
}

  document.querySelector(".sidebar").classList.add("open");
  document.querySelector(".overlay").classList.add("show");
}

function closeSidebar(){
  document.querySelector(".sidebar").classList.remove("open");
  document.querySelector(".overlay").classList.remove("show");
}
  
 
// טעינה
function loadTheme(){
  const theme = localStorage.getItem("theme");

  if(theme === "light"){
    document.body.classList.add("light");
  } else if(theme === "gray"){
    document.body.classList.add("gray");
  }

  updateThemeButton(); // 👈 חשוב
}
  function updateThemeButton(){
  const btn = document.getElementById("themeBtn");
  const body = document.body;

  if(body.classList.contains("light")){
    // אתה כרגע במצב בהיר → הכפתור מציע כהה
    btn.textContent = "בהיר  ☀️";
    btn.style.color = "#000";
    btn.style.background = "#fff";

  } else if(body.classList.contains("gray")){
    // מצב ביניים → מציע לעבור לבהיר
    btn.textContent = " מצב ביניים 🌅";
    btn.style.color = "#fff";
    btn.style.background = "#444";

  } else {
    // מצב כהה → מציע לעבור לאמצע
    btn.textContent = "מצב כהה 🌠";
    btn.style.color = "#fff";
    btn.style.background = "#000";
  }
}
function toggleTheme(){
  const body = document.body;

  if(body.classList.contains("light")){
    body.classList.remove("light");
    body.classList.add("gray");
    localStorage.setItem("theme","gray");

  } else if(body.classList.contains("gray")){
    body.classList.remove("gray");
    localStorage.setItem("theme","dark");

  } else {
    body.classList.add("light");
    localStorage.setItem("theme","light");
  }

  updateThemeButton(); // 👈 חשוב
}

  
// ------------------
loadTheme(); // 👈 זה מה שחסר לך
loadLocal();
renderWord();
showList(); // 👈 כדי שגם הרשימה תופיע מעודכנת
